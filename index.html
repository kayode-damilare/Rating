<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <script src="script.js" defer></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-[#141519] gap-6">
  <section 
  id="main-card"
  class="bg-[#202731] w-full max-w-xs flex flex-col rounded-lg p-4 text-white gap-4 sm:gap-6 sm:max-w-md">
    <div class="bg-[#2f3742] p-2 w-12 h-12 rounded-full flex justify-center items-center">
      <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1789035558/icon-star_hn5xiy.svg" alt="" >
    </div>
      <h1 class="font-semibold text-xl">How did we do?</h1>
      <p class="text-[#767f8c] text-sm leading-6">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      <div class="flex justify-between">
        <button
        value="1" 
        class="rating aspect-square bg-[#202731] w-full max-w-12 rounded-full text-[#767f8c] font-semibold cursor-pointer hover:bg-[#fb7413] hover:text-black focus:outline-none focus:ring-2 focus:ring-[#fb7413] transition-colors duration-300">1</button>

        <button 
        value="2"
        class="rating aspect-square bg-[#202731] w-full max-w-12 rounded-full text-[#767f8c] font-semibold cursor-pointer hover:bg-[#fb7413] hover:text-black focus:outline-none focus:ring-2 focus:ring-[#fb7413] transition-colors duration-300">2</button>

        <button 
        value="3"
        class="rating aspect-square bg-[#202731] w-full max-w-12 rounded-full text-[#767f8c] font-semibold cursor-pointer hover:bg-[#fb7413] hover:text-black focus:outline-none focus:ring-2 focus:ring-[#fb7413] transition-colors duration-300">3</button>

        <button 
        value="4"
        class="rating aspect-square bg-[#202731] w-full max-w-12 rounded-full text-[#767f8c] font-semibold cursor-pointer hover:bg-[#fb7413] hover:text-black focus:outline-none focus:ring-2 focus:ring-[#fb7413] transition-colors duration-300">4</button>

        <button 
        value="5"
        class="rating aspect-square bg-[#202731] w-full max-w-12 rounded-full text-[#767f8c] font-semibold cursor-pointer hover:bg-[#fb7413] hover:text-black focus:outline-none focus:ring-2 focus:ring-[#fb7413] transition-colors duration-300">
        5</button>
      </div>
      <button 
      id="submit"
      class="w-full bg-[#fb7413] rounded-3xl text-[#252d37] py-3 cursor-pointer text-sm uppercase font-semibold tracking-wider hover:bg-white transition-colors duration-300">Submit</button>
  </section>
  <section 
  id="thank-you"
  class="hidden bg-[#202731] w-full max-w-xs flex flex-col justify-center items-center rounded-lg p-4 text-white gap-4 sm:gap-6 sm:max-w-md">
    <div>
      <img src="https://res.cloudinary.com/vyomyquu/image/upload/v1789035566/illustration-thank-you_rnq6c8.svg" alt="">
    </div>
    <div>
      <p 
      id="score"
      class=""></p>
    </div>
    <h1>Thank You</h1>
    <p>
      We appreciate you taking the time to give a rating. If you ever need
      more support, don't hesitate to get in touch!
    </p>
  </section>
</body>
</html>
